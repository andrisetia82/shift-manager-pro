                    ['- Shift B and Shift C still cannot run more than 6 straight days in a row for the same employee; any cell that would break this is skipped and reported after upload (except the rare edge case where it is unavoidable).'],
                    ['- Employee Code values that do not match any employee in the app are skipped and reported after upload.'],
                    ['- Unrecognized shift codes are skipped and reported after upload.']
                ];
                const wsInstr = XLSX.utils.aoa_to_sheet(instrRows);
                wsInstr['!cols'] = [{ wch: 60 }, { wch: 34 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, wsRoster, 'Roster');
                XLSX.utils.book_append_sheet(wb, wsInstr, 'Instructions');
                XLSX.writeFile(wb, `Roster_Template_${monthNames[currentMonth]}_${currentYear}.xlsx`);
                showToast('Roster template downloaded.');
            };

            // Parses an uploaded workbook (from downloadRosterTemplate, or an equivalent sheet)
            // and applies it to the currently open month. Cells belonging to an approved Shift
            // Request are always left alone, and the 6-day straight Shift B/C cap is enforced
            // cell-by-cell rather than trusting the uploaded file.
            const applyRosterUpload = (workbook) => {
                const sheetName = workbook.SheetNames.includes('Roster') ? 'Roster' : workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });
                if (!rows.length) { showToast('The uploaded file has no data.', 'error'); return; }

                const header = rows[0];
                const codeColIdx = header.findIndex(h => String(h).trim().toLowerCase() === 'employee code');
                if (codeColIdx === -1) { showToast('Could not find an "Employee Code" column in the uploaded file.', 'error'); return; }

                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const monthDates = new Set(Array.from({ length: daysInMonth }, (_, i) => formatDate(i + 1, currentMonth, currentYear)));

                const dateCols = [];
                header.forEach((h, idx) => {
                    const m = String(h).match(/^(\d{4}-\d{2}-\d{2})/);
                    if (m && monthDates.has(m[1])) dateCols.push({ idx, date: m[1] });
                });
                if (!dateCols.length) {
                    showToast(`No columns in this file match ${monthNames[currentMonth]} ${currentYear}. Make sure you're uploading the template for the month currently open in the Schedule view.`, 'error');
                    return;
                }
                dateCols.sort((a, b) => a.date.localeCompare(b.date));

                const [, shiftB_id, shiftC_id] = getCoreShiftIds();
                const codeToShiftId = {};
                shiftTypes.forEach(s => { codeToShiftId[s.shortName.toUpperCase()] = s.id; });

                const newSchedule = JSON.parse(JSON.stringify(schedule));
                const getMergedShiftId = (dateStr, empId) => {
                    const val = (newSchedule[dateStr] || {})[empId];
                    return typeof val === 'object' && val !== null ? val.id : val;
                };

                let updatedCount = 0;
                const unmatchedCodes = new Set();
                const invalidCells = [];
                let lockedSkipped = 0;
                const streakSkipped = [];

                for (let r = 1; r < rows.length; r++) {
                    const row = rows[r];
                    const rawCode = row[codeColIdx];
                    if (rawCode === '' || rawCode === undefined) continue;
                    const emp = employees.find(e => (e.code || '').trim().toUpperCase() === String(rawCode).trim().toUpperCase());
                    if (!emp) { unmatchedCodes.add(String(rawCode)); continue; }

                    // Seed the running Shift B/C streak from the day before the first uploaded
                    // date column, so the cap is enforced correctly even mid-month.
                    let streakShiftId = null, streakLen = 0;
                    {
                        let d = addDaysToDateStr(dateCols[0].date, -1);
                        const seedShiftId = getMergedShiftId(d, emp.id);
                        if (seedShiftId === shiftB_id || seedShiftId === shiftC_id) {
                            streakShiftId = seedShiftId;
                            streakLen = 1;
                            while (true) {
                                d = addDaysToDateStr(d, -1);
                                const v = getMergedShiftId(d, emp.id);
                                if (v === streakShiftId) streakLen++; else break;
                            }
                        }
                    }

                    const finalizeStreak = (finalShiftId) => {
                        if (finalShiftId === shiftB_id || finalShiftId === shiftC_id) {
                            streakLen = (finalShiftId === streakShiftId) ? streakLen + 1 : 1;
                            streakShiftId = finalShiftId;
                        } else {
                            streakShiftId = null; streakLen = 0;
                        }
                    };

                    dateCols.forEach(({ idx, date }) => {
                        const raw = row[idx];
                        const cellText = String(raw === undefined ? '' : raw).trim();

                        if (isShiftRequested(date, emp.id)) { lockedSkipped++; finalizeStreak(getMergedShiftId(date, emp.id)); return; }
                        if (cellText === '') { finalizeStreak(getMergedShiftId(date, emp.id)); return; }

                        let action = null; // { type: 'clear' } | { type: 'set', id }
                        if (cellText === '-' || cellText.toUpperCase() === 'CLEAR') {
                            action = { type: 'clear' };
                        } else if (cellText.toUpperCase() === 'L') {
                            action = { type: 'set', id: 'L' };
                        } else {
                            const stripped = cellText.replace(/\s*\[LOCKED\]\s*/i, '').trim();
                            const matchId = codeToShiftId[stripped.toUpperCase()];
                            if (matchId !== undefined) action = { type: 'set', id: matchId };
                        }

                        if (!action) {
                            invalidCells.push(`${emp.code || emp.name} · ${date}: "${cellText}"`);
                            finalizeStreak(getMergedShiftId(date, emp.id));
                            return;
                        }

                        if (action.type === 'set' && (action.id === shiftB_id || action.id === shiftC_id) &&
                            streakShiftId === action.id && streakLen + 1 > 6) {
                            streakSkipped.push(`${emp.code || emp.name} · ${date}`);
                            finalizeStreak(getMergedShiftId(date, emp.id));
                            return;
                        }

                        if (!newSchedule[date]) newSchedule[date] = {};
                        if (action.type === 'clear') {
                            delete newSchedule[date][emp.id];
                            finalizeStreak(undefined);
                        } else {
                            newSchedule[date][emp.id] = { id: action.id, isManual: true };
                            finalizeStreak(action.id);
                        }
                        updatedCount++;
                    });
                }

                setSchedule(newSchedule);

                const parts = [`${updatedCount} cell(s) updated for ${monthNames[currentMonth]} ${currentYear}.`];
                if (lockedSkipped) parts.push(`${lockedSkipped} locked shift-request cell(s) left unchanged.`);
                if (unmatchedCodes.size) parts.push(`${unmatchedCodes.size} unmatched employee code(s) skipped: ${Array.from(unmatchedCodes).slice(0, 5).join(', ')}${unmatchedCodes.size > 5 ? '…' : ''}.`);
                if (invalidCells.length) parts.push(`${invalidCells.length} cell(s) had an unrecognized shift code and were skipped.`);
                if (streakSkipped.length) parts.push(`${streakSkipped.length} cell(s) skipped to keep Shift B/C under the 6-day straight cap.`);

                showToast(parts.join(' '), (unmatchedCodes.size || invalidCells.length || streakSkipped.length) ? 'warning' : 'success');
            };

            const handleRosterUploadClick = () => {
                if (typeof XLSX === 'undefined') {
                    showToast('Excel library failed to load. Check your internet connection.', 'error');
                    return;
                }
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,.xls';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = new Uint8Array(event.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            applyRosterUpload(workbook);
                        } catch (err) {
                            showToast('Failed to read the uploaded file. Make sure it is a valid .xlsx file exported from this template.', 'error');
                        }
                    };
                    reader.readAsArrayBuffer(file);
                };
                input.click();
            };

            // --- SAVE MONTH AS A LOCKED RECORD (separate from the live, editable schedule) ---
            const getMonthRecordKey = (month, year) => `${year}-${month}`;

            const saveMonthRecord = () => {
                const recordKey = getMonthRecordKey(currentMonth, currentYear);
                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const dates = Array.from({ length: daysInMonth }, (_, i) => formatDate(i + 1, currentMonth, currentYear));

                const monthSchedule = {};
                dates.forEach(date => { if (schedule[date]) monthSchedule[date] = schedule[date]; });

                const record = {
                    monthLabel: `${monthNames[currentMonth]} ${currentYear}`,
                    savedAt: new Date().toISOString(),
                    schedule: monthSchedule,
                    employees: JSON.parse(JSON.stringify(employees)),
                    shiftTypes: JSON.parse(JSON.stringify(shiftTypes)),
                    holidays: holidays.filter(h => dates.includes(h.date)),
                    leaves: leaves.filter(l => dates.includes(l.date))
                };

                try {
                    const updated = { ...savedRecords, [recordKey]: record };
                    localStorage.setItem('shiftManagerSavedRecords', JSON.stringify(updated));
                    setSavedRecords(updated);
                    showToast(`${record.monthLabel} saved as a record.`);
                } catch (e) {
                    showToast('Failed to save month record.', 'error');
                }
            };

            const restoreMonthRecord = () => {
                const recordKey = getMonthRecordKey(currentMonth, currentYear);
                const record = savedRecords[recordKey];
                if (!record) return;
                if (!window.confirm(`Restore the saved record for ${record.monthLabel} (saved ${new Date(record.savedAt).toLocaleString()})? This will overwrite the current roster for this month.`)) return;

                setSchedule(prev => {
                    const next = { ...prev };
                    Object.keys(record.schedule).forEach(date => { next[date] = record.schedule[date]; });
                    return next;
                });
                showToast(`${record.monthLabel} restored from saved record.`);
            };

            const getEmployeeStats = (employeeId) => {
                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                let stats = { total: 0, counts: {}, offTarget: 0, offActual: 0 };
                shiftTypes.forEach(s => stats.counts[s.id] = 0);
                stats.counts['L'] = 0; // Initialize Leave counter
                
                const emp = employees.find(e => e.id === employeeId);
                stats.offTarget = emp ? getEffectiveOffTarget(emp, currentMonth, currentYear) : 0;
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = formatDate(day, currentMonth, currentYear);
                    const shiftId = getShiftIdForDate(date, employeeId);
                    
                    if (shiftId) {
                        stats.total++;
                        if (stats.counts[shiftId] !== undefined) {
                            stats.counts[shiftId]++;
                        }
                        
                        // Dynamically handle the L shift so the app doesn't crash
                        const shiftObj = shiftTypes.find(s => s.id === shiftId) || 
                                       (shiftId === 'L' ? { shortName: 'L', name: 'Leave' } : null);
                                       
                        if (shiftObj && (shiftObj.shortName === 'OFF' || shiftObj.name === 'Day Off')) {
                            stats.offActual++;
                        }
                    }
                }
                return stats;
            };

            const addEmployee = (newEmployee) => {
                const id = employees.length > 0 ? Math.max(...employees.map(e => e.id)) + 1 : 1;
                const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#14B8A6', '#F97316'];
                const color = colors[id % colors.length];
                setEmployees([...employees, { ...newEmployee, id, color }]);
                setShowAddEmployee(false);
            };

            const updateEmployee = (id, updates) => {
                setEmployees(employees.map(emp => emp.id === id ? { ...emp, ...updates } : emp));
                setEditingEmployee(null);
            };

            // Drag-and-drop reordering: the position in the `employees` array is the display order
            // everywhere (Schedule grid rows, Employees cards, exports). Dropping onto a target moves
            // the dragged employee to that target's position. Works on the full list, so it stays
            // correct even while a search/role filter is active. Persisted automatically via localStorage.
            const moveEmployee = (fromId, toId) => {
                if (fromId === null || toId === null || fromId === toId) return;
                setEmployees(prev => {
                    const fromIdx = prev.findIndex(e => e.id === fromId);
                    const toIdx = prev.findIndex(e => e.id === toId);
                    if (fromIdx === -1 || toIdx === -1) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(fromIdx, 1);
                    next.splice(toIdx, 0, moved);
                    return next;
                });
                showToast('Employee order updated.');
            };

            const getDragProps = (employeeId) => ({
                draggable: true,
                onDragStart: (e) => {
                    setDragEmpId(employeeId);
                    e.dataTransfer.effectAllowed = 'move';
                    try { e.dataTransfer.setData('text/plain', String(employeeId)); } catch (err) { }
                },
                onDragOver: (e) => {
                    if (dragEmpId === null) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    if (dragOverEmpId !== employeeId) setDragOverEmpId(employeeId);
                },
                onDrop: (e) => {
                    e.preventDefault();
                    moveEmployee(dragEmpId, employeeId);
                    setDragEmpId(null);
                    setDragOverEmpId(null);
                },
                onDragEnd: () => { setDragEmpId(null); setDragOverEmpId(null); }
            });

            const deleteEmployee = (id) => {
                if (window.confirm('Are you sure you want to delete this employee?')) {
                    setEmployees(employees.filter(emp => emp.id !== id));
                    const newSchedule = {};
                    Object.keys(schedule).forEach(date => {
                        const daySchedule = { ...schedule[date] };
                        delete daySchedule[id];
                        newSchedule[date] = daySchedule;
                    });
                    setSchedule(newSchedule);
                    setLeaves(leaves.filter(l => l.empId !== id));
                }
            };

            const filteredEmployees = employees.filter(emp => {
                const term = searchTerm.toLowerCase();
                const matchesSearch = emp.name.toLowerCase().includes(term) ||
                                      emp.email.toLowerCase().includes(term) ||
                                      (emp.code || '').toLowerCase().includes(term) ||
                                      (emp.group || '').toLowerCase().includes(term);
                const matchesRole = filterRole === 'all' || emp.role === filterRole;
                return matchesSearch && matchesRole;
            });

            const nextMonth = () => {
                if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(currentYear + 1); } 
                else { setCurrentMonth(currentMonth + 1); }
            };

            const prevMonth = () => {
                if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(currentYear - 1); } 
                else { setCurrentMonth(currentMonth - 1); }
            };

            const renderScheduleView = () => {
                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
                const monthRecordKey = `${currentYear}-${currentMonth}`;
                const currentMonthRecord = savedRecords[monthRecordKey];

                // Shift G's counter column is shown before Shift A's (and the rest keep their
                // normal order) in the schedule's per-employee totals.
                const gShiftForCounter = shiftTypes.find(s => s.shortName === 'G');
                const counterOrderedShifts = gShiftForCounter
                    ? [gShiftForCounter, ...shiftTypes.filter(s => s.shortName !== 'G')]
                    : shiftTypes;

                return (
                    <div className="space-y-4">
                        <div className="flex justify-between items-center flex-wrap gap-3">
                            <div className="flex items-center gap-4">
                                <button onClick={prevMonth} className="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded flex items-center">
                                    <span className="material-icons text-[20px]">chevron_left</span>
                                </button>
                                <h2 className="text-2xl font-bold">
                                    {monthNames[currentMonth]} {currentYear}
                                </h2>
                                <button onClick={nextMonth} className="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded flex items-center">
                                    <span className="material-icons text-[20px]">chevron_right</span>
                                </button>
                            </div>
                            <div className="flex gap-2 flex-wrap items-center">
                                <button onClick={generateAutoSchedule} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 shadow-md hover:shadow-lg transition-all">
                                    <span className="material-icons text-[16px]">calendar_today</span>
                                    Auto Fill
                                </button>
                                <button onClick={clearSchedule} className="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 shadow-md">
                                    Clear All
                                </button>
                                <button onClick={saveMonthRecord} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-md flex items-center gap-2">
                                    <span className="material-icons text-[16px]">bookmark_add</span>
                                    Save Month as Record
                                </button>
                                {currentMonthRecord && (
                                    <button onClick={restoreMonthRecord} title={`Saved ${new Date(currentMonthRecord.savedAt).toLocaleString()}`} className="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 shadow-md flex items-center gap-2">
                                        <span className="material-icons text-[16px]">restore</span>
                                        Restore Saved
                                    </button>
                                )}
                                <button onClick={exportMonthlyReport} className="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 shadow-md flex items-center gap-2">
                                    <span className="material-icons text-[16px]">grid_on</span>
                                    Export Monthly Report
                                </button>
                                <button onClick={downloadRosterTemplate} title="Download a fill-in-the-blanks Excel template for this month" className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 shadow-md flex items-center gap-2">
                                    <span className="material-icons text-[16px]">description</span>
                                    Download Roster Template
                                </button>
                                <button onClick={handleRosterUploadClick} title="Upload a filled-in roster template for this month" className="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 shadow-md flex items-center gap-2">
                                    <span className="material-icons text-[16px]">upload_file</span>
                                    Upload Roster
                                </button>
                            </div>
                        </div>
                        {currentMonthRecord && (
                            <div className="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1 -mt-2">
                                <span className="material-icons text-[14px]">check_circle</span>
                                Last saved record: {new Date(currentMonthRecord.savedAt).toLocaleString()}
                            </div>
                        )}

                        <div className="overflow-x-auto pb-4">
                            <div className="min-w-max border dark:border-gray-700 rounded-lg overflow-hidden flex flex-col">
                                <div className="flex bg-gray-100 dark:bg-gray-800">
                                    <div className="w-48 shrink-0 p-3 font-semibold border-r dark:border-gray-700">Employee</div>
                                    <div className="flex">
                                        {days.map(day => {
                                            const date = formatDate(day, currentMonth, currentYear);
                                            const isWeekendDay = isWeekend(day, currentMonth, currentYear);
                                            
                                            const dayHolidays = holidays.filter(h => h.date === date);
                                            const isHolidayDay = dayHolidays.length > 0;
                                            
                                            return (
                                                <div key={day} className={`w-16 shrink-0 p-2 text-center font-semibold border-r dark:border-gray-700 text-sm ${isWeekendDay || isHolidayDay ? 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400' : ''}`}>
                                                    <div>{day}</div>
                                                    <div className="text-xs opacity-75">{['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'][getDayOfWeek(day, currentMonth, currentYear)]}</div>
                                                    {isHolidayDay && (
                                                        <div className="text-[10px] mt-1 leading-tight text-red-600 dark:text-red-400 font-bold truncate" title={dayHolidays.map(h => h.name).join(', ')}>
                                                            {dayHolidays[0].name}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="flex shrink-0 border-l-[3px] border-gray-300 dark:border-gray-500 bg-gray-200 dark:bg-gray-700">
                                        {counterOrderedShifts.map(shift => (
                                            <div key={`head-sum-${shift.id}`} className="w-12 shrink-0 p-2 text-center font-bold text-xs border-r dark:border-gray-600 flex flex-col justify-center" title={`Total ${shift && shift.name}`}>
                                                {shift && shift.shortName}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {filteredEmployees.map(employee => {
                                    const stats = getEmployeeStats(employee.id);
                                    const quotaMatched = stats.offActual === stats.offTarget;
                                    
                                    return (
                                        <div key={employee.id}
                                            onDragOver={getDragProps(employee.id).onDragOver}
                                            onDrop={getDragProps(employee.id).onDrop}
                                            className={`flex border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800/50 ${dragEmpId === employee.id ? 'opacity-40' : ''} ${dragOverEmpId === employee.id && dragEmpId !== employee.id ? 'border-t-4 border-t-blue-500' : ''}`}>
                                            <div {...getDragProps(employee.id)} title="Drag to reorder employee" className="w-48 shrink-0 p-3 font-medium border-r dark:border-gray-700 flex items-center gap-1 text-white cursor-grab active:cursor-grabbing select-none" style={{ backgroundColor: employee && employee.color ? employee.color : '#666' }}>
                                                <span className="material-icons text-[18px] opacity-70 shrink-0">drag_indicator</span>
                                                <div>
                                                    <div>{employee && employee.name}</div>
                                                    <div className="text-xs opacity-90">{employee && employee.role} • {employee && employee.country}</div>
                                                    {stats.offTarget > 0 && (
                                                        <div className={`text-[10px] mt-1 px-1 py-0.5 rounded inline-block bg-black/20 ${quotaMatched ? 'text-green-200' : 'text-yellow-200 font-bold'}`}>
                                                            Quota: {stats.offActual}/{stats.offTarget} OFFs
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex">
                                                {days.map(day => {
                                                    const date = formatDate(day, currentMonth, currentYear);
                                                    const shiftId = getShiftIdForDate(date, employee.id);
                                                    let shift = getShiftForEmployee(shiftId, employee);
                                                    
                                                    const isManual = isShiftManual(date, employee.id);
                                                    const isRequested = isShiftRequested(date, employee.id);
                                                    
                                                    const isHoliday = checkIsHoliday(date, employee, holidays, countries);
                                                    const isLeave = leaves.some(l => l.date === date && l.empId === employee.id);
                                                    const isWeekendDay = isWeekend(day, currentMonth, currentYear);
                                                    
                                                    let customBg = shift ? shift.color : null;
                                                    if (!customBg) customBg = darkMode ? '#1f2937' : '#FFFFFF';
                                                    if (isLeave) customBg = darkMode ? '#374151' : '#E5E7EB'; 
                                                    
                                                    return (
                                                        <div key={day}
                                                            className={`relative w-16 shrink-0 p-1 border-r dark:border-gray-700 flex flex-col items-center justify-center transition-colors hover:opacity-80 ${isRequested ? 'cursor-not-allowed' : 'cursor-pointer'} ${isWeekendDay && !shift ? 'bg-red-50 dark:bg-red-900/20' : ''}`}
                                                            style={{ backgroundColor: customBg }}
                                                            onClick={() => {
                                                                // Cells locked by a Shift Request cannot be overridden from the grid —
                                                                // remove the request first (Shift Requests page) to change this cell.
                                                                if (isRequested) return;
                                                                const nextShiftId = ((shiftId || 0) % shiftTypes.length) + 1;
                                                                assignShift(date, employee.id, nextShiftId);
                                                            }}
                                                            title={`${employee.name} - ${shift ? shift.name : 'No shift'}${shift && shift.regionCode ? ` [${shift.regionCode}]` : ''} ${isHoliday ? '(Holiday)' : ''} ${isLeave ? '(Leave)' : ''} ${isRequested ? '(Staff Requested — locked, remove the request to change it)' : (isManual ? '(Manually Assigned)' : '')}`}
                                                        >
                                                            <span className={`text-xs font-bold ${darkMode && (!shift || !shift.color) ? 'text-white' : 'text-gray-900'}`}>{shift ? shift.shortName : '-'}</span>
                                                            
                                                            {(isHoliday || isLeave) && <span className="text-[9px] text-blue-600 dark:text-blue-400 leading-none mt-0.5">*{isLeave ? 'LV' : 'HL'}</span>}
                                                            
                                                            {isRequested && shift && (
                                                                <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-white border border-gray-400 rounded-full" title="Staff Requested (locked)"></div>
                                                            )}
                                                            {isManual && !isRequested && shift && (
                                                                <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-yellow-400 rounded-full" title="Manually Assigned"></div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="flex shrink-0 border-l-[3px] border-gray-300 dark:border-gray-500 bg-gray-50 dark:bg-gray-800/50">
                                                {counterOrderedShifts.map(shift => (
                                                    <div key={`sum-${employee.id}-${shift.id}`} className="w-12 shrink-0 p-2 text-center text-sm font-semibold border-r dark:border-gray-700 flex items-center justify-center">
                                                        {stats.counts[shift.id] > 0 ? stats.counts[shift.id] : <span className="text-gray-300 dark:text-gray-600">-</span>}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}

                                <div className="border-t-[3px] border-gray-300 dark:border-gray-500"></div>
                                {counterOrderedShifts.map(shift => {
                                    const isWorkShift = shift.name !== 'Day Off' && shift.shortName !== 'OFF';
                                    if (!isWorkShift) return null; 

                                    return (
                                        <div key={`summary-${shift.id}`} className="flex border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800/80">
                                            <div className="w-48 shrink-0 p-3 text-sm font-medium border-r dark:border-gray-700 flex items-center justify-end text-gray-600 dark:text-gray-400">
                                                Total {shift.shortName}:
                                            </div>
                                            <div className="flex">
                                                {days.map(day => {
                                                    const date = formatDate(day, currentMonth, currentYear);
                                                    
                                                    const count = employees.filter(emp => getShiftIdForDate(date, emp.id) === shift.id).length;
                                                    
                                                    const isWeekendDay = isWeekend(day, currentMonth, currentYear);
                                                    const dayHolidays = holidays.filter(h => h.date === date);
                                                    const isHolidayDay = dayHolidays.length > 0;
                                                    
                                                    let isWarning = false;
                                                    if (shift.shortName === 'M' || shift.shortName === 'A' || shift.shortName === 'N') {
                                                        isWarning = count !== 1;
                                                    }

                                                    return (
                                                        <div key={`count-${day}`} 
                                                            className={`w-16 shrink-0 p-2 text-center text-sm font-bold border-r dark:border-gray-700 transition-colors
                                                                ${isWeekendDay || isHolidayDay ? 'bg-red-50/50 dark:bg-red-900/10' : ''} 
                                                                ${isWarning ? 'text-red-500 dark:text-red-400' : 'text-gray-700 dark:text-gray-300'}
                                                            `}>
                                                            {count}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="flex shrink-0 border-l-[3px] border-transparent bg-gray-200 dark:bg-gray-700 opacity-50">
                                                {shiftTypes.map(s => <div key={`empty-bot-${s.id}`} className="w-12 shrink-0 border-r dark:border-gray-600"></div>)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
                            <h3 className="font-semibold mb-3">Shift Codes & Legend</h3>
                            <div className="flex flex-wrap gap-4 mb-4">
                                {shiftTypes.map(shift => (
                                    <div key={shift.id} className="flex items-center gap-2">
                                        <div className="w-8 h-8 rounded flex items-center justify-center text-xs font-bold text-gray-900 shadow-sm" style={{ backgroundColor: shift.color }}>
                                            {shift.shortName}
                                        </div>
                                        <div className="text-sm">
                                            <div className="font-medium">{shift.name}</div>
                                            {shift.start && shift.end && (
                                                <div className="text-xs text-gray-500 dark:text-gray-400">{shift.start} - {shift.end}</div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex flex-wrap gap-4 text-xs text-gray-500 dark:text-gray-400 border-t dark:border-gray-700 pt-3">
                                <div className="flex items-center gap-1"><span className="text-blue-600 dark:text-blue-400 font-bold">*HL</span> = Country Holiday</div>
                                <div className="flex items-center gap-1"><span className="text-blue-600 dark:text-blue-400 font-bold">*LV</span> = Employee Leave</div>
                                <div className="flex items-center gap-1"><span className="w-1.5 h-1.5 bg-yellow-400 rounded-full"></span> = Manually Assigned Shift</div>
                                <div className="flex items-center gap-1"><span className="w-1.5 h-1.5 bg-white border border-gray-400 rounded-full"></span> = Staff-Requested Shift (locked, survives Clear All, can't be manually overridden — remove/edit the request instead)</div>
                                <div className="flex items-center gap-1">Auto Fill keeps each staff member's monthly Shift B and Shift C counts as close as possible.</div>
                                <div className="flex items-center gap-1">Auto Fill caps Shift B and Shift C at 6 straight days each &mdash; a break is required after that (only exceeded in edge cases, e.g. when the whole team is already at the cap).</div>
                                <div className="flex items-center gap-1">On Saturdays, Sundays, and Public Holidays, Auto Fill schedules only one Shift A, one Shift B, and one Shift C, and never uses Shift G.</div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderEmployeesView = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold">Employees</h2>
                        <div className="flex gap-2">
                            <button onClick={saveEmployeeConfig} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2">
                                <span className="material-icons text-[16px]">save</span> Save Changes
                            </button>
                            <button onClick={() => setShowAddEmployee(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                <span className="material-icons text-[16px]">add</span> Add Employee
                            </button>
                        </div>
                    </div>

                    <p className="text-sm text-gray-500 dark:text-gray-400 -mt-2 flex items-center gap-1">
                        <span className="material-icons text-[16px]">drag_indicator</span>
                        Drag an employee card onto another to change the order. The same order is used in the Schedule grid and Excel exports.
                    </p>

                    <div className="flex gap-4">
                        <div className="flex-1 relative">
                            <span className="material-icons absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-[20px]">search</span>
                            <input type="text" placeholder="Search employees..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-800" />
                        </div>
                        <select value={filterRole} onChange={(e) => setFilterRole(e.target.value)} className="px-4 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-800">
                            <option value="all">All Roles</option>
                            <option value="Manager">Manager</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filteredEmployees.map(employee => {
                            const cObj = countries.find(c => c.code === employee.country);
                            const countryName = cObj ? cObj.name : employee.country;
                            return (
                                <div key={employee.id}
                                    {...getDragProps(employee.id)}
                                    className={`border dark:border-gray-700 rounded-lg p-4 hover:shadow-lg transition-shadow cursor-grab active:cursor-grabbing ${dragEmpId === employee.id ? 'opacity-40' : ''} ${dragOverEmpId === employee.id && dragEmpId !== employee.id ? 'ring-2 ring-blue-500 border-blue-500' : ''}`}>
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="flex items-center gap-3">
                                            <span className="material-icons text-[20px] text-gray-400 -mr-1 select-none" title="Drag to reorder">drag_indicator</span>
                                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg" style={{ backgroundColor: employee.color }}>
                                                {employee.name ? employee.name.charAt(0) : '?'}
                                            </div>

                                {countries.length === 0 && <p className="text-sm text-gray-500">Add a country in Employee Configuration first.</p>}
                            </div>
                        </div>

                        <div className="border dark:border-gray-700 rounded-lg p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-xl font-semibold">Shift Codes</h3>
                                <div className="flex gap-2">
                                    <button onClick={saveShiftCodes} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2">
                                        <span className="material-icons text-[16px]">save</span> Save Shift Codes
                                    </button>
                                    <button onClick={addShiftType} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                        <span className="material-icons text-[16px]">add</span> Add Shift Code
                                    </button>
                                </div>
                            </div>
                            <p className="text-xs text-gray-500 dark:text-gray-400 -mt-2 mb-4">
                                Give each shift code its own Region Code per country (e.g. an internal reference like "TS-01") so it lines up with each region's own numbering &mdash; it's just a label and doesn't change the shift's actual time. For a shift that applies to every region (like OFF or Leave), type "ALL" in one Region Code column and leave the rest blank.
                            </p>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 dark:bg-gray-800">
                                            <th className="border dark:border-gray-700 p-2 text-left font-semibold">Shift Name</th>
                                            <th className="border dark:border-gray-700 p-2 text-left font-semibold">Short Code</th>
                                            <th className="border dark:border-gray-700 p-2 text-left font-semibold">Start Time</th>
                                            <th className="border dark:border-gray-700 p-2 text-left font-semibold">End Time</th>
                                            <th className="border dark:border-gray-700 p-2 text-left font-semibold">Color</th>
                                            {countries.map(c => (
                                                <th key={c.code} className="border dark:border-gray-700 p-2 text-left font-semibold whitespace-nowrap">Region Code {c.code}</th>
                                            ))}
                                            <th className="border dark:border-gray-700 p-2 w-10"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {shiftTypes.map(shift => (
                                            <tr key={shift.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/50">
                                                <td className="border dark:border-gray-700 p-1">
                                                    <input type="text" value={shift.name} onChange={(e) => updateShiftType(shift.id, { name: e.target.value })} className="w-full min-w-[110px] px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded" />
                                                </td>
                                                <td className="border dark:border-gray-700 p-1">
                                                    <input type="text" value={shift.shortName} maxLength="4" onChange={(e) => updateShiftType(shift.id, { shortName: e.target.value })} className="w-16 px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded" />
                                                </td>
                                                <td className="border dark:border-gray-700 p-1">
                                                    <input type="time" lang="en-GB" value={shift.start} onChange={(e) => updateShiftType(shift.id, { start: e.target.value })} className="w-full min-w-[100px] px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded" />
                                                </td>
                                                <td className="border dark:border-gray-700 p-1">
                                                    <input type="time" lang="en-GB" value={shift.end} onChange={(e) => updateShiftType(shift.id, { end: e.target.value })} className="w-full min-w-[100px] px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded" />
                                                </td>
                                                <td className="border dark:border-gray-700 p-1">
                                                    <div className="flex items-center gap-2 px-1">
                                                        <input type="color" value={shift.color} onChange={(e) => updateShiftType(shift.id, { color: e.target.value })} className="w-8 h-8 border dark:border-gray-700 rounded cursor-pointer shrink-0" />
                                                    </div>
                                                </td>
                                                {countries.map(c => (
                                                    <td key={c.code} className="border dark:border-gray-700 p-1">
                                                        <input
                                                            type="text"
                                                            value={(shift.regionCodes && shift.regionCodes[c.code]) || ''}
                                                            placeholder="-"
                                                            onChange={(e) => updateShiftType(shift.id, { regionCodes: { ...(shift.regionCodes || {}), [c.code]: e.target.value } })}
                                                            className="w-full min-w-[90px] px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
                                                        />
                                                    </td>
                                                ))}
                                                <td className="border dark:border-gray-700 p-1 text-center">
                                                    <button onClick={() => deleteShiftType(shift.id)} disabled={shiftTypes.length <= 1} className="p-1 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded disabled:opacity-30 disabled:cursor-not-allowed">
                                                        <span className="material-icons text-[18px]">delete</span>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {/* Leave (L) is a built-in pseudo-shift used by Shift Requests and the schedule grid;
                                            its color and region codes are configurable here but it isn't part of the Auto Fill
                                            planning shifts, so its name/code/hours are fixed. */}
                                        <tr className="hover:bg-gray-50 dark:hover:bg-gray-800/50 bg-gray-50/50 dark:bg-gray-800/30">
                                            <td className="border dark:border-gray-700 p-1">
                                                <span className="block px-2 py-1.5 text-gray-500 dark:text-gray-400">Leave</span>
                                            </td>
                                            <td className="border dark:border-gray-700 p-1">
                                                <span className="block px-2 py-1.5 text-gray-500 dark:text-gray-400">L</span>
                                            </td>
                                            <td className="border dark:border-gray-700 p-1">
                                                <span className="block px-2 py-1.5 text-gray-300 dark:text-gray-600">-</span>
                                            </td>
                                            <td className="border dark:border-gray-700 p-1">
                                                <span className="block px-2 py-1.5 text-gray-300 dark:text-gray-600">-</span>
                                            </td>
                                            <td className="border dark:border-gray-700 p-1">
                                                <div className="flex items-center gap-2 px-1">
                                                    <input type="color" value={leaveConfig.color} onChange={(e) => setLeaveConfig({ ...leaveConfig, color: e.target.value })} className="w-8 h-8 border dark:border-gray-700 rounded cursor-pointer shrink-0" />
                                                </div>
                                            </td>
                                            {countries.map(c => (
                                                <td key={c.code} className="border dark:border-gray-700 p-1">
                                                    <input
                                                        type="text"
                                                        value={(leaveConfig.regionCodes && leaveConfig.regionCodes[c.code]) || ''}
                                                        placeholder="-"
                                                        onChange={(e) => setLeaveConfig({ ...leaveConfig, regionCodes: { ...(leaveConfig.regionCodes || {}), [c.code]: e.target.value } })}
                                                        className="w-full min-w-[90px] px-2 py-1.5 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
                                                    />
                                                </td>
                                            ))}
                                            <td className="border dark:border-gray-700 p-1"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="border dark:border-gray-700 rounded-lg p-6">
                            <h3 className="text-xl font-semibold mb-4 text-blue-600 dark:text-blue-400 flex items-center gap-2">
                                <span className="material-icons">date_range</span> Ad-hoc Excel Report (Custom Cut-off)
                            </h3>
                            <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">Pick any start and end date &mdash; e.g. a payroll cut-off like the 26th of one month to the 25th of the next &mdash; and export the roster for that exact period.</p>
                            <div className="flex flex-wrap items-end gap-3">
                                <div>
                                    <label className="block text-sm font-medium mb-1">From</label>
                                    <input type="date" value={adhocFrom} onChange={(e) => setAdhocFrom(e.target.value)} className="px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-800" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">To</label>
                                    <input type="date" value={adhocTo} onChange={(e) => setAdhocTo(e.target.value)} className="px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-800" />
                                </div>
                                <button onClick={exportAdhocReport} className="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 flex items-center gap-2">
                                    <span className="material-icons text-[16px]">grid_on</span> Export Ad-hoc Report
                                </button>
                            </div>
                        </div>

                        <div className="border dark:border-gray-700 rounded-lg p-6">
                            <h3 className="text-xl font-semibold mb-4">Export / Import</h3>
                            <div className="flex gap-4">
                                <button onClick={() => {
                                    const data = { employees, shiftTypes, schedule, countries, holidays, leaves };
                                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a'); a.href = url; a.download = `shift-schedule-${Date.now()}.json`; a.click();
                                }} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2">
                                    <span className="material-icons text-[16px]">download</span> Export Data
                                </button>
                                <button onClick={() => {
                                    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
                                    input.onchange = (e) => {
                                        const file = e.target.files[0]; const reader = new FileReader();
                                        reader.onload = (event) => {
                                            try {
                                                const data = JSON.parse(event.target.result);
                                                if (data.employees) setEmployees(data.employees);
                                                if (data.shiftTypes) setShiftTypes(data.shiftTypes);
                                                if (data.schedule) setSchedule(data.schedule);
                                                if (data.countries) setCountries(data.countries);
                                                if (data.holidays) setHolidays(data.holidays);
                                                if (data.leaves) setLeaves(data.leaves);
                                                alert('Data imported successfully!');
                                            } catch (error) { alert('Error importing data. Please check the file format.'); }
                                        };
                                        reader.readAsText(file);
                                    };
                                    input.click();
                                }} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                    <span className="material-icons text-[16px]">upload</span> Import Data
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (!dataLoaded) return null;

            return (
                <div className={`min-h-screen ${darkMode ? 'dark bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'}`}>
                    <header className="bg-white dark:bg-gray-800 shadow-sm border-b dark:border-gray-700">
                        <div className="max-w-7xl mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <span className="material-icons text-[32px] text-blue-600">calendar_today</span>
                                    <h1 className="text-2xl font-bold">Shift Manager Pro</h1>
                                </div>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg flex items-center">
                                    <span className="material-icons text-[20px]">{darkMode ? 'light_mode' : 'dark_mode'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white dark:bg-gray-800 border-b dark:border-gray-700">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex gap-1">
                                {[
                                    { id: 'schedule', label: 'Schedule', icon: 'calendar_today' },
                                    { id: 'employees', label: 'Employees', icon: 'group' },
                                    { id: 'requests', label: 'Shift Requests', icon: 'how_to_reg' },
                                    { id: 'analytics', label: 'Analytics', icon: 'analytics' },
                                    { id: 'settings', label: 'Settings', icon: 'settings' }
                                ].map(({ id, label, icon }) => (
                                    <button key={id} onClick={() => setCurrentView(id)}
                                        className={`flex items-center gap-2 px-4 py-3 font-medium transition-colors ${currentView === id ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'}`}>
                                        <span className="material-icons text-[16px]">{icon}</span> {label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 py-8">
                        {currentView === 'schedule' && renderScheduleView()}
                        {currentView === 'employees' && renderEmployeesView()}
                        {currentView === 'requests' && renderShiftRequestsView()}
                        {currentView === 'analytics' && renderAnalyticsView()}
                        {currentView === 'settings' && renderSettingsView()}
                    </main>

                    {showAddEmployee && <AddEmployeeModal countries={countries} onClose={() => setShowAddEmployee(false)} onAdd={addEmployee} />}
                    {editingEmployee && <EditEmployeeModal employee={editingEmployee} countries={countries} onClose={() => setEditingEmployee(null)} onUpdate={updateEmployee} />}

                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-[100] px-5 py-3 rounded-lg shadow-lg text-white flex items-center gap-2 max-w-md ${toast.type === 'error' ? 'bg-red-600' : toast.type === 'warning' ? 'bg-amber-600' : 'bg-green-600'}`}>
                            <span className="material-icons text-[18px] shrink-0">{toast.type === 'error' ? 'error' : toast.type === 'warning' ? 'warning' : 'check_circle'}</span>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftManagementApp />);
    </script>
</body>
</html>
