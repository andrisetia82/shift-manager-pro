    <script type="text/babel">
        const { useState, useEffect } = React;

        const defaultCountries = [

            { id: 2, name: 'Andri', code: 'EMP002', group: 'Tech Support', email: 'andri@company.com', phone: '555-0102', role: 'Staff', country: 'ID', color: '#10B981' },
            { id: 3, name: 'Haikal', code: 'EMP003', group: 'Tech Support', email: 'haikal@company.com', phone: '555-0103', role: 'Staff', country: 'ID', color: '#F59E0B' },
            { id: 4, name: 'Zulfikar', code: 'EMP004', group: 'Customer Service', email: 'zhulfikar@company.com', phone: '555-0104', role: 'Staff', country: 'ID', color: '#EF4444' },
            { id: 5, name: 'Brian', code: 'EMP005', group: 'Customer Service', email: 'brian@company.com', phone: '555-0105', role: 'Staff', country: 'ID', color: '#8B5CF6' },

        const defaultShiftTypes = [
            { id: 1, name: 'Morning', start: '08:00', end: '17:00', color: '#FEF3C7', shortName: 'A', regionCodes: { ID: 'TS-01', PH: 'TS-05' } },
            { id: 2, name: 'Afternoon', start: '16:00', end: '01:00', color: '#DBEAFE', shortName: 'B', regionCodes: { ID: 'TS-02', PH: 'TS-06' } },
            { id: 3, name: 'Night', start: '00:00', end: '09:00', color: '#E5E7EB', shortName: 'C', regionCodes: { ID: 'TS-03', PH: 'TS-07' } },
            { id: 4, name: 'General', start: '09:00', end: '18:00', color: '#D1FAE5', shortName: 'G', regionCodes: { ID: 'MS', PH: 'TS-08' } },

        const defaultHolidays = [

        ];

        const AddEmployeeModal = ({ countries, onClose, onAdd }) => {
            const defaultCode = countries.length > 0 ? countries[0].code : '';
            const [formData, setFormData] = useState({ name: '', code: '', group: '', email: '', phone: '', role: 'Staff', country: defaultCode });
            
            const handleSubmit = (e) => { e.preventDefault(); onAdd(formData); };
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md">
                        <h3 className="text-xl font-bold mb-4">Add New Employee</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm font-medium mb-1">Name</label><input type="text" required value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block text-sm font-medium mb-1">Employee Code</label><input type="text" placeholder="e.g. EMP007" value={formData.code} onChange={(e) => setFormData({ ...formData, code: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                                <div><label className="block text-sm font-medium mb-1">Employee Group</label><input type="text" placeholder="e.g. Tech Support" value={formData.group} onChange={(e) => setFormData({ ...formData, group: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Email</label><input type="email" required value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block text-sm font-medium mb-1">Phone</label><input type="tel" required value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Country</label>
                                    <select required value={formData.country} onChange={(e) => setFormData({ ...formData, country: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900">
                                        {countries.map(c => <option key={c.code} value={c.code}>{c.code} - {c.name}</option>)}

                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Role</label>
                                <select value={formData.role} onChange={(e) => setFormData({ ...formData, role: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900">

                                </select>
                            </div>
                            <div className="flex gap-2 justify-end mt-4">

            );
        };

        const EditEmployeeModal = ({ employee, countries, onClose, onUpdate }) => {
            const [formData, setFormData] = useState({ code: '', group: '', ...employee });
            const handleSubmit = (e) => { e.preventDefault(); onUpdate(employee.id, formData); };
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md">
                        <h3 className="text-xl font-bold mb-4">Edit Employee</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm font-medium mb-1">Name</label><input type="text" required value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block text-sm font-medium mb-1">Employee Code</label><input type="text" placeholder="e.g. EMP007" value={formData.code} onChange={(e) => setFormData({ ...formData, code: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                                <div><label className="block text-sm font-medium mb-1">Employee Group</label><input type="text" placeholder="e.g. Tech Support" value={formData.group} onChange={(e) => setFormData({ ...formData, group: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Email</label><input type="email" required value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block text-sm font-medium mb-1">Phone</label><input type="tel" required value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900" /></div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Country</label>
                                    <select required value={formData.country} onChange={(e) => setFormData({ ...formData, country: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900">
                                        {countries.map(c => <option key={c.code} value={c.code}>{c.code} - {c.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Role</label>
                                <select value={formData.role} onChange={(e) => setFormData({ ...formData, role: e.target.value })} className="w-full px-3 py-2 border dark:border-gray-700 rounded-lg dark:bg-gray-900">
                                    <option value="Manager">Manager</option><option value="Staff">Staff</option>
                                </select>
                            </div>
                            <div className="flex gap-2 justify-end mt-4">
                                <button type="button" onClick={onClose} className="px-4 py-2 border dark:border-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">Cancel</button>
                                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ShiftManagementApp = () => {
            const [currentView, setCurrentView] = useState('schedule');
            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
            const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
            const [darkMode, setDarkMode] = useState(false);
            
            const [dataLoaded, setDataLoaded] = useState(false);
            const [employees, setEmployees] = useState(defaultEmployees);
            const [shiftTypes, setShiftTypes] = useState(defaultShiftTypes);
            const [schedule, setSchedule] = useState({});
            
            const [countries, setCountries] = useState(defaultCountries);
            const [holidays, setHolidays] = useState(defaultHolidays);
            const [leaves, setLeaves] = useState([]);

            const [editingEmployee, setEditingEmployee] = useState(null);
            const [dragEmpId, setDragEmpId] = useState(null);
            const [dragOverEmpId, setDragOverEmpId] = useState(null);
            const [showAddEmployee, setShowAddEmployee] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterRole, setFilterRole] = useState('all');
            
            const [newHoliday, setNewHoliday] = useState({ date: '', name: '', countryCode: 'ID' });
            const [newCountry, setNewCountry] = useState({ name: '', code: '' });
            const [shiftRequests, setShiftRequests] = useState([]);
            const [newRequest, setNewRequest] = useState({ empId: '', mode: 'date', date: '', weekday: '5', weekOfMonth: '1', dayScope: 'workdays', reqMonth: new Date().getMonth(), reqYear: new Date().getFullYear(), shiftId: '', note: '' });

            const [toast, setToast] = useState(null);
            const [adhocFrom, setAdhocFrom] = useState('');
            const [adhocTo, setAdhocTo] = useState('');
            const [savedRecords, setSavedRecords] = useState({});
            const [leaveConfig, setLeaveConfig] = useState({ color: '#FB923C', regionCodes: { ID: 'ALL' } });
            const [offRules, setOffRules] = useState({});

            // Returns the configured OFF Day Rule for a region, or null if none is set. When set,
            // it can only tighten the monthly OFF quota (a stricter cap below the natural
            // weekend/holiday count) — it can never raise it above that natural count. The total
            // number of OFF days in a month is always ceilinged at Saturdays + Sundays + public
            // holidays for that region, so this is the value getEffectiveOffTarget clamps to.
            const getMaxOffForRegion = (countryCode) => {
                const val = offRules[countryCode];
                if (val === undefined || val === null || val === '') return null;
                const n = parseInt(val);
                return isNaN(n) ? null : n;
            };

            // The effective monthly OFF target for an employee: Saturdays + Sundays + public
            // holidays configured for their region in that month is the hard ceiling — the total
            // number of OFF days can never pass this count. A region's configured OFF Day Rule can
            // only lower that ceiling further (e.g. cap OFF at 5 even though the month naturally has
            // 9 weekend/holiday days); it is ignored if it would raise the target above the natural
            // count.
            const getEffectiveOffTarget = (employee, month, year) => {
                const natural = getNaturalOffDaysForRegion(employee.country, month, year);
                const override = getMaxOffForRegion(employee.country);
                if (override !== null) return Math.min(override, natural);
                return natural;
            };

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), type === 'warning' ? 5000 : 3000);
            };

            useEffect(() => {
                try {
                    const savedData = localStorage.getItem('shiftManagerAppOfflineData');
                    if (savedData) {
                        const parsed = JSON.parse(savedData);
                        if (parsed.employees) setEmployees(parsed.employees);
                        if (parsed.shiftTypes) setShiftTypes(parsed.shiftTypes);
                        if (parsed.schedule) setSchedule(parsed.schedule);
                        if (parsed.darkMode !== undefined) setDarkMode(parsed.darkMode);
                        if (parsed.countries) setCountries(parsed.countries);
                        if (parsed.holidays) setHolidays(parsed.holidays);
                        if (parsed.leaves) setLeaves(parsed.leaves);
                        if (parsed.shiftRequests) setShiftRequests(parsed.shiftRequests);
                        if (parsed.leaveConfig) setLeaveConfig(parsed.leaveConfig);
                        if (parsed.offRules) setOffRules(parsed.offRules);
                    }
                    const savedRecordsRaw = localStorage.getItem('shiftManagerSavedRecords');
                    if (savedRecordsRaw) setSavedRecords(JSON.parse(savedRecordsRaw));
                } catch (e) { }
                setDataLoaded(true);
            }, []);

            useEffect(() => {
                if (dataLoaded) {
                    try {
                        localStorage.setItem('shiftManagerAppOfflineData', JSON.stringify({
                            employees, shiftTypes, schedule, darkMode, countries, holidays, leaves, shiftRequests, leaveConfig, offRules
                        }));
                    } catch (e) { }
                }
            }, [employees, shiftTypes, schedule, darkMode, countries, holidays, leaves, shiftRequests, leaveConfig, offRules, dataLoaded]);

            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];

            const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
            const formatDate = (day, month, year) => `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            // Shared date-string arithmetic used by streak-cap checks (manual edits, Shift
            // Requests, and Roster Excel upload all need to walk forward/backward by day).
            const addDaysToDateStr = (dateStr, n) => {
                const dt = new Date(dateStr + 'T00:00:00');
                dt.setDate(dt.getDate() + n);
                return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
            };

            const getShiftIdForDate = (date, empId) => {
                const val = (schedule[date] || {})[empId];
                return typeof val === 'object' && val !== null ? val.id : val;
            };

            // Resolves a shift ID to its shift-code definition. Each shift code carries a
            // Region Code per country (an informational reference label) rather than separate
            // times per region, so the lookup is a simple ID match; the employee's region is
            // only used to pick which Region Code label to display for that code.
            const getShiftForEmployee = (shiftId, employee) => {
                if (shiftId === undefined || shiftId === null) return null;
                if (shiftId === 'L') return { id: 'L', name: 'Leave', shortName: 'L', color: leaveConfig.color, regionCode: employee ? (leaveConfig.regionCodes || {})[employee.country] : undefined };
                const base = shiftTypes.find(s => s.id === shiftId);
                if (!base) return null;
                const regionCode = employee ? (base.regionCodes || {})[employee.country] : undefined;
                return { ...base, regionCode };
            };

            const isShiftManual = (date, empId) => {
                const val = (schedule[date] || {})[empId];
                return typeof val === 'object' && val !== null ? val.isManual : (val !== undefined);
            };

            const isShiftRequested = (date, empId) => {
                const val = (schedule[date] || {})[empId];
                return typeof val === 'object' && val !== null ? !!val.isRequest : false;
            };

            // Same "one work shift per Short Code" dedupe used by Auto Fill, so manual edits and
            // Shift Requests can be checked against the same A/B/C core shift codes it uses.
            const getCoreShiftIds = () => {
                const work = shiftTypes.filter(s => s.name !== 'Day Off' && s.shortName !== 'OFF');
                const seen = new Set();
                const deduped = [];
                work.forEach(s => { if (!seen.has(s.shortName)) { seen.add(s.shortName); deduped.push(s); } });
                return deduped.slice(0, 3).map(s => s.id);
            };

            const isWeekendOrHolidayForDate = (date, employee) => {
                const dow = new Date(date + 'T00:00:00').getDay();
                if (dow === 0 || dow === 6) return true;
                return checkIsHoliday(date, employee, holidays, countries);
            };

            // Returns a violation message if putting `shiftId` on `date` for `employeeId` would give
            // a Saturday/Sunday/Public Holiday a second person on the same Shift A, B, or C. This is
            // a hard rule — exactly one person per core shift on those days, no exceptions — so
            // manual edits and Shift Requests are rejected outright rather than just warned, the same
            // as the streak-cap and OFF-quota rules. Returns null if it's fine.
            const checkCoreShiftCapViolation = (date, employeeId, shiftId) => {
                const empIdNum = parseInt(employeeId);
                const employee = employees.find(e => e.id === empIdNum);
                if (!employee) return null;
                if (!isWeekendOrHolidayForDate(date, employee)) return null;
                if (!getCoreShiftIds().includes(shiftId)) return null;

                const dayEntry = schedule[date] || {};
                const others = Object.keys(dayEntry).filter(empIdStr => {
                    if (parseInt(empIdStr) === empIdNum) return false;
                    const val = dayEntry[empIdStr];
                    const valId = typeof val === 'object' && val !== null ? val.id : val;
                    return valId === shiftId;
                }).map(empIdStr => {
                    const e = employees.find(x => x.id === parseInt(empIdStr));
                    return e ? e.name : 'Someone';
                });

                if (others.length === 0) return null;
                const shiftDef = shiftTypes.find(s => s.id === shiftId);
                const shiftLabel = shiftDef ? `Shift ${shiftDef.shortName}` : 'this shift';
                return `${others.join(', ')} ${others.length > 1 ? 'are' : 'is'} already on ${shiftLabel} on ${date} — only one person is allowed on ${shiftLabel} on Saturdays, Sundays, and Public Holidays.`;
            };

            // Returns a violation message if putting `shiftId` on ALL of `dates` for `employeeId`
            // would create more than 6 straight days of the same Shift B or Shift C for that
            // employee — counting both what's already on the schedule (auto-filled, manual, or a
            // prior request) and the new dates being applied together. Returns null if it's fine.
            // This is a hard rule: Shift Requests and manual edits must obey it just like Auto Fill.
            const checkStreakCapViolation = (employeeId, dates, shiftId) => {
                const [aId, bId, cId] = getCoreShiftIds();
                if (shiftId !== bId && shiftId !== cId) return null;
                const empIdNum = parseInt(employeeId);
                const requestedSet = new Set(dates);

                const addDays = (dateStr, n) => {
                    const dt = new Date(dateStr + 'T00:00:00');
                    dt.setDate(dt.getDate() + n);
                    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
                };
                const getShiftOnDate = (dateStr) => {
                    if (requestedSet.has(dateStr)) return shiftId;
                    const val = (schedule[dateStr] || {})[empIdNum];
                    return typeof val === 'object' && val !== null ? val.id : val;
                };

                let worstStreak = 0, worstDate = null;
                dates.forEach(d => {
                    let streak = 1, cur = d;
                    while (getShiftOnDate(addDays(cur, -1)) === shiftId) { streak++; cur = addDays(cur, -1); }
                    cur = d;
                    while (getShiftOnDate(addDays(cur, 1)) === shiftId) { streak++; cur = addDays(cur, 1); }
                    if (streak > worstStreak) { worstStreak = streak; worstDate = d; }
                });

                if (worstStreak > 6) {
                    const shiftDef = shiftTypes.find(s => s.id === shiftId);
                    const shiftLabel = shiftDef ? `Shift ${shiftDef.shortName}` : 'this shift';
                    return `This would create ${worstStreak} straight days of ${shiftLabel} (around ${worstDate}) — the maximum allowed is 6 in a row.`;
                }
                return null;
            };

            // Returns a violation message if putting the Day Off shift on ALL of `dates` for
            // `employeeId` would give them more OFF days in any one calendar month than that
            // month's OFF target (Saturdays + Sundays + public holidays for their region, or a
            // stricter configured OFF Day Rule — see getEffectiveOffTarget). Counts both what's
            // already on the schedule and the new dates together, per month, since a recurring
            // request can span more than one month. Returns null if it's fine, or if `shiftId`
            // isn't the Day Off shift at all (this rule only applies to OFF).
            const checkOffQuotaViolation = (employeeId, dates, shiftId) => {
                const offShiftType = shiftTypes.find(s => s.shortName === 'OFF' || s.name === 'Day Off');
                if (!offShiftType || shiftId !== offShiftType.id) return null;
                const empIdNum = parseInt(employeeId);
                const employee = employees.find(e => e.id === empIdNum);
                if (!employee) return null;

                const requestedSet = new Set(dates);
                const monthsTouched = new Map();
                dates.forEach(d => {
                    const dt = new Date(d + 'T00:00:00');
                    const key = `${dt.getFullYear()}-${dt.getMonth()}`;
                    if (!monthsTouched.has(key)) monthsTouched.set(key, { month: dt.getMonth(), year: dt.getFullYear() });
                });

                for (const { month, year } of monthsTouched.values()) {
                    const target = getEffectiveOffTarget(employee, month, year);
                    const daysInM = getDaysInMonth(month, year);

                    let count = 0;
                    for (let d = 1; d <= daysInM; d++) {
                        const dateStr = formatDate(d, month, year);
                        if (requestedSet.has(dateStr)) { count++; continue; }
                        if (getShiftIdForDate(dateStr, empIdNum) === offShiftType.id) count++;
                    }

                    if (count > target) {
                        return `This would give ${employee.name} ${count} OFF days in ${monthNames[month]} ${year} — the maximum allowed is ${target} (Saturdays + Sundays + public holidays for their region).`;
                    }
                }
                return null;
            };

            // Manual edits directly on the Schedule grid are a deliberate human override, so they
            // are exempt from every rule Auto Fill and Shift Requests must otherwise obey (the 6-day
            // Shift B/C streak cap, the monthly OFF quota, and the one-person-per-core-shift cap on
            // Saturdays/Sundays/holidays) — no validation, no warning. However, a cell that is
            // currently locked by a Shift Request is NOT eligible for this direct-grid override —
            // the grid's onClick handler blocks the click before assignShift is ever called for
            // such a cell. To change a Shift-Request-locked cell, the request itself must be
            // removed/edited from the Shift Requests page. Shift Requests themselves still go
            // through the full validation in applyShiftRequestDates.
            const assignShift = (date, employeeId, shiftTypeId) => {
                setSchedule(prev => {
                    const current = (prev[date] || {})[employeeId];
                    const currentIsRequested = typeof current === 'object' && current !== null && !!current.isRequest;
                    if (currentIsRequested) return prev; // locked by a Shift Request — no direct-grid override
                    return {
                        ...prev,
                        [date]: { ...prev[date], [employeeId]: { id: shiftTypeId, isManual: true } }
                    };
                });
            };

            // --- SHIFT REQUESTS (staff-requested shifts: locked onto the roster, survive Auto Fill AND Clear All) ---
            const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            // Applies one shift/date combo (or many, for a recurring group) to shiftRequests + the schedule.
            const applyShiftRequestDates = (empId, dates, shiftId, note, groupId, groupLabel) => {
                const empIdNum = parseInt(empId);
                const shiftIdVal = shiftId === 'L' ? 'L' : parseInt(shiftId);

                // Hard rule: this whole submission is rejected if it would push any straight run of
                // Shift B or Shift C past 5 days — Shift Requests must obey the same cap Auto Fill does.
                const streakViolation = checkStreakCapViolation(empIdNum, dates, shiftIdVal);
                if (streakViolation) {
                    showToast(`Request not submitted: ${streakViolation}`, 'error');
                    return;
                }

                // Hard rule: requesting the Day Off shift must obey the same monthly OFF quota
                // Auto Fill does — it can't push this employee's total OFF days for that month
                // above the Saturdays + Sundays + public holidays target.
                const offViolation = checkOffQuotaViolation(empIdNum, dates, shiftIdVal);
                if (offViolation) {
                    showToast(`Request not submitted: ${offViolation}`, 'error');
                    return;
                }

                // Hard rule: this whole submission is rejected if any date would give a Saturday,
                // Sunday, or Public Holiday a second person on the same Shift A, B, or C — exactly
                // one person per core shift on those days, no exceptions.
                const coreShiftViolation = dates.map(date => checkCoreShiftCapViolation(date, empIdNum, shiftIdVal)).find(Boolean);
                if (coreShiftViolation) {
                    showToast(`Request not submitted: ${coreShiftViolation}`, 'error');
                    return;
                }

                const newRequestRecords = dates.map((date, i) => ({
                    id: Date.now() + i,
                    empId: empIdNum,
                    date,
                    shiftId: shiftIdVal,
                    note: note || '',
                    groupId: groupId || null,
                    groupLabel: groupLabel || null,
                    createdAt: new Date().toISOString()
                }));
                setShiftRequests(prev => [...prev, ...newRequestRecords]);
                setSchedule(prev => {
                    const next = { ...prev };
                    newRequestRecords.forEach(req => {
                        next[req.date] = { ...next[req.date], [req.empId]: { id: req.shiftId, isManual: true, isRequest: true, requestId: req.id } };
                    });
                    return next;
                });

                const submittedMsg = groupId
                    ? `${dates.length} shift requests submitted (${groupLabel}) and added to the roster.`
                    : 'Shift request submitted and added to the roster.';

                showToast(submittedMsg);
            };

            // mode: 'date' -> a single specific date. 'weekday' -> every occurrence of a chosen
            // weekday (e.g. every Friday) within a chosen month/year. 'weekOfMonth' -> every
            // workday (or every day) within a chosen week-of-the-month (e.g. week 1 = days 1-7).
            const submitShiftRequest = ({ empId, mode, date, weekday, weekOfMonth, dayScope, reqMonth, reqYear, shiftId, note }) => {
                if (!empId || !shiftId) { showToast('Please choose an employee and a shift.', 'error'); return; }

                if (mode === 'weekday') {
                    const m = parseInt(reqMonth), y = parseInt(reqYear), wd = parseInt(weekday);
                    const daysInM = getDaysInMonth(m, y);
                    const dates = [];
                    for (let d = 1; d <= daysInM; d++) {
                        if (getDayOfWeek(d, m, y) === wd) dates.push(formatDate(d, m, y));
                    }
                    if (dates.length === 0) { showToast('No matching dates found for that month.', 'error'); return; }
                    const groupId = Date.now();
                    const groupLabel = `Every ${weekdayNames[wd]}, ${monthNames[m]} ${y}`;
                    applyShiftRequestDates(empId, dates, shiftId, note, groupId, groupLabel);
                } else if (mode === 'weekOfMonth') {
                    const m = parseInt(reqMonth), y = parseInt(reqYear), wk = parseInt(weekOfMonth);
                    const weeks = getWeeksOfMonth(m, y);
                    const range = weeks[wk - 1];
                    if (!range) { showToast('That week does not exist in the chosen month.', 'error'); return; }
                    const dates = [];
                    for (let d = range.start; d <= range.end; d++) {
                        const wd = getDayOfWeek(d, m, y);
                        const isWorkday = wd >= 1 && wd <= 5;
                        if (dayScope === 'all' || isWorkday) dates.push(formatDate(d, m, y));
                    }
                    if (dates.length === 0) { showToast('No matching dates found for that week.', 'error'); return; }
                    const groupId = Date.now();
                    const weekLabel = ['1st', '2nd', '3rd', '4th', '5th', '6th'][wk - 1] || `${wk}th`;
                    const scopeLabel = dayScope === 'all' ? 'All days' : 'Workdays';
                    const groupLabel = `${scopeLabel}, ${weekLabel} week of ${monthNames[m]} ${y} (${shortDateLabel(range.start, m, y)}\u2013${shortDateLabel(range.end, m, y)})`;
                    applyShiftRequestDates(empId, dates, shiftId, note, groupId, groupLabel);
                } else {
                    if (!date) { showToast('Please choose a date.', 'error'); return; }
                    applyShiftRequestDates(empId, [date], shiftId, note, null, null);
                }
            };

            const clearRequestSlot = (prevSchedule, request) => {
                const dayEntry = prevSchedule[request.date];
                if (!dayEntry) return prevSchedule;
                const cell = dayEntry[request.empId];
                const cellId = typeof cell === 'object' && cell !== null ? cell.id : cell;
                const cellRequestId = typeof cell === 'object' && cell !== null ? cell.requestId : null;
                // Only clear the slot if it's still exactly this request's assignment (don't clobber later manual edits)
                if (cellRequestId === request.id || (cellRequestId === undefined && cellId === request.shiftId)) {
                    const nextDay = { ...dayEntry };
                    delete nextDay[request.empId];
                    return { ...prevSchedule, [request.date]: nextDay };
                }
                return prevSchedule;
            };

            const removeShiftRequest = (requestId) => {
                const request = shiftRequests.find(r => r.id === requestId);
                if (!request) return;
                if (!window.confirm('Remove this shift request? Its slot on the roster will be cleared so it can be re-assigned.')) return;
                setShiftRequests(prev => prev.filter(r => r.id !== requestId));
                setSchedule(prev => clearRequestSlot(prev, request));
                showToast('Shift request removed.');
            };

            const removeShiftRequestGroup = (groupId) => {
                const group = shiftRequests.filter(r => r.groupId === groupId);
                if (group.length === 0) return;
                if (!window.confirm(`Remove all ${group.length} requests in "${group[0].groupLabel}"? Their roster slots will be cleared so they can be re-assigned.`)) return;
                setShiftRequests(prev => prev.filter(r => r.groupId !== groupId));
                setSchedule(prev => group.reduce((acc, request) => clearRequestSlot(acc, request), prev));
                showToast('Recurring shift request group removed.');
            };

            const getDayOfWeek = (day, month, year) => new Date(year, month, day).getDay();
            const isWeekend = (day, month, year) => {
                const dayOfWeek = getDayOfWeek(day, month, year);
                return dayOfWeek === 0 || dayOfWeek === 6;
            };

            // Splits a month into real calendar weeks that always end on Sunday, following that
            // month's actual layout. The first and last weeks are often partial (e.g. if the
            // month starts on a Wednesday, week 1 only runs Wed-Sun).
            const getWeeksOfMonth = (month, year) => {
                const daysInMonth = getDaysInMonth(month, year);
                const weeks = [];
                let start = 1;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dow = getDayOfWeek(d, month, year);
                    if (dow === 0 || d === daysInMonth) {
                        weeks.push({ start, end: d });
                        start = d + 1;
                    }
                }
                return weeks;
            };

            const shortDateLabel = (d, month, year) => `${monthNames[month].slice(0, 3)} ${d}`;

            const checkIsHoliday = (date, emp, holidaysList, countriesList) => {
                return holidaysList.some(h => {
                    if (h.date !== date) return false;
                    const hVal = String(h.countryCode || h.country || '').toUpperCase();
                    const eVal = String(emp.country || '').toUpperCase();
                    if (hVal === eVal) return true;
                    const c1 = countriesList.find(c => c.code.toUpperCase() === hVal || c.name.toUpperCase() === hVal);
                    const c2 = countriesList.find(c => c.code.toUpperCase() === eVal || c.name.toUpperCase() === eVal);
                    return c1 && c2 && c1.code === c2.code;
                });
            };

            // The default OFF quota for a region, for a given month: every Saturday & Sunday in
            // that month, plus every public holiday configured for that region in that month.
            // This mirrors exactly how Auto Fill computes each employee's natural OFF target,
            // so admins can see what "no rule set" actually means before overriding it.
            const getNaturalOffDaysForRegion = (countryCode, month, year) => {
                const daysInM = getDaysInMonth(month, year);
                let count = 0;
                for (let d = 1; d <= daysInM; d++) {
                    const dateStr = formatDate(d, month, year);
                    if (isWeekend(d, month, year)) count++;
                    if (checkIsHoliday(dateStr, { country: countryCode }, holidays, countries)) count++;
                }
                return count;
            };

            // --- THE PRIORITY-ALLOCATION ENGINE ---
            const generateAutoSchedule = () => {
                const newSchedule = {};
                Object.keys(schedule).forEach(date => {
                    newSchedule[date] = {};
                    Object.keys(schedule[date]).forEach(empIdStr => {
                        const empId = parseInt(empIdStr);
                        if (isShiftManual(date, empId)) {
                            newSchedule[date][empId] = schedule[date][empId];
                        }
                    });
                });

                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const allWorkShifts = shiftTypes.filter(s => s.name !== 'Day Off' && s.shortName !== 'OFF');
                const offShift = shiftTypes.find(s => s.name === 'Day Off' || s.shortName === 'OFF') || { id: 5 };

                // Multiple shift codes can share the same Short Code with different Regions
                // (e.g. two "A" entries, one per country). For planning purposes the engine only
                // needs one canonical representative per code; the actual regional time is
                // resolved for display via getShiftForEmployee.
                const workShifts = [];
                const seenShortNames = new Set();
                allWorkShifts.forEach(s => {
                    if (!seenShortNames.has(s.shortName)) {
                        seenShortNames.add(s.shortName);
                        workShifts.push(s);
                    }
                });

                const coreShifts = workShifts.slice(0, 3);
                const managerShift = shiftTypes.find(s => s.shortName === 'G' || s.name === 'Shift G') || workShifts[3] || coreShifts[0];

                const shiftA_id = coreShifts[0] ? coreShifts[0].id : 1;
                const shiftB_id = coreShifts[1] ? coreShifts[1].id : 2;
                const shiftC_id = coreShifts[2] ? coreShifts[2].id : 3;
                const shiftG_id = managerShift.id;

                // --- CONTINUITY WITH PREVIOUS MONTH ---
                // Look at how each employee's previous month ended, so day 1 of this month
                // respects the same fatigue caps and "no jumping out of night shift" rules
                // instead of starting from a blank slate.
                const prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
                const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
                const prevDaysInMonth = getDaysInMonth(prevMonth, prevYear);
                const prevMonthRecord = savedRecords[`${prevYear}-${prevMonth}`];

                const getPrevShiftForDate = (dateStr, empId) => {
                    // Prefer live schedule data (the schedule state holds history across all months)
                    const liveDay = schedule[dateStr];
                    if (liveDay && liveDay[empId] !== undefined) {
                        const v = liveDay[empId];
                        return typeof v === 'object' && v !== null ? v.id : v;
                    }
                    // Fall back to a saved record for that month, if the live data isn't there
                    if (prevMonthRecord && prevMonthRecord.schedule[dateStr] && prevMonthRecord.schedule[dateStr][empId] !== undefined) {
                        const v = prevMonthRecord.schedule[dateStr][empId];
                        return typeof v === 'object' && v !== null ? v.id : v;
                    }
                    return undefined;
                };

                const scanWorkStreakBack = (empId) => {
                    let count = 0;
                    for (let dd = prevDaysInMonth; dd >= 1 && count < 10; dd--) {
                        const raw = getPrevShiftForDate(formatDate(dd, prevMonth, prevYear), empId);
                        if (raw === undefined || raw === 'L' || raw === offShift.id) break;
                        count++;
                    }
                    return count;
                };

                const scanShiftStreakBack = (empId, targetShiftId) => {
                    if (targetShiftId === undefined || targetShiftId === 'L' || targetShiftId === offShift.id) return 0;
                    let count = 0;
                    for (let dd = prevDaysInMonth; dd >= 1 && count < 10; dd--) {
                        const raw = getPrevShiftForDate(formatDate(dd, prevMonth, prevYear), empId);
                        if (raw !== targetShiftId) break;
                        count++;
                    }
                    return count;
                };

                const scanOffStreakBack = (empId) => {
                    let count = 0;
                    for (let dd = prevDaysInMonth; dd >= 1 && count < 10; dd--) {
                        const raw = getPrevShiftForDate(formatDate(dd, prevMonth, prevYear), empId);
                        if (raw !== offShift.id) break;
                        count++;
                    }
                    return count;
                };

                const empStates = {};
                
                employees.forEach((emp, index) => {
                    // Effective monthly OFF target: always ceilinged at the natural Saturday/Sunday
                    // + public holiday count for this month; a region's configured OFF Day Rule can
                    // only lower that further, never raise it. See getEffectiveOffTarget.
                    let targetOffDays = getEffectiveOffTarget(emp, currentMonth, currentYear);

                    // Check how this employee's previous month ended
                    const prevLastDate = formatDate(prevDaysInMonth, prevMonth, prevYear);
                    const rawPrevLast = getPrevShiftForDate(prevLastDate, emp.id);

                    let contCurrentShiftId = null, contShiftStreak = 0, contWorkStreak = (index % 4), contOffStreak = 0;
                    if (rawPrevLast !== undefined) {
                        contCurrentShiftId = rawPrevLast;
                        if (rawPrevLast === offShift.id) {
                            contOffStreak = scanOffStreakBack(emp.id);
                            contWorkStreak = 0;
                            contShiftStreak = 0;
                        } else if (rawPrevLast === 'L') {
                            contWorkStreak = 0;
                            contShiftStreak = 0;
                            contOffStreak = 0;
                        } else {
                            contWorkStreak = scanWorkStreakBack(emp.id);
                            contShiftStreak = scanShiftStreakBack(emp.id, rawPrevLast);
                            contOffStreak = 0;
                        }
                    }

                    // PERFECT MATHEMATICAL STAGGER: Guarantees 0,1,2,3 spread so people never burn out together
                    // (used only as a fallback when there's no previous-month data to check)
                    empStates[emp.id] = { 
                        workStreak: contWorkStreak, 
                        shiftStreak: contShiftStreak, 
                        offStreak: contOffStreak,
                        currentShiftId: contCurrentShiftId,
                        targetOffDays: targetOffDays,
                        currentOffCount: 0,
                        shiftBCount: 0,
                        shiftCCount: 0
                    };
                });

                // Every Saturday, Sunday, and public holiday FORCES an OFF for anyone not on a core
                // shift that day (Shift G isn't allowed then) — that's what makes up the natural OFF
                // target in the first place. Precompute each employee's forced-OFF day numbers for
                // the month so the discretionary weekday OFF/G choice below can check, before handing
                // out an "extra" OFF today, whether the remaining budget still covers every forced day
                // still ahead. Without this reservation, an early discretionary OFF can leave the
                // budget short by the time a later mandatory weekend/holiday arrives, pushing the
                // month's total OFF count past the target.
                const forcedOffDayNumbers = {};
                employees.forEach(emp => {
                    const days = [];
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dStr = formatDate(d, currentMonth, currentYear);
                        if (isWeekend(d, currentMonth, currentYear) || checkIsHoliday(dStr, emp, holidays, countries)) {
                            days.push(d);
                        }
                    }
                    forcedOffDayNumbers[emp.id] = days;
                });
                const countFutureForcedOffDays = (empId, afterDay) =>
                    forcedOffDayNumbers[empId].filter(d => d > afterDay).length;

                const calculateScore = (p, reqShiftId, day) => {
                    let state = p.state;
                    let score = 0;
                    
                    let remainingDays = daysInMonth - day + 1;
                    let remainingOffs = state.targetOffDays - state.currentOffCount;
                    
                    let mustOffQuota = remainingOffs >= remainingDays;
                    let mustWorkQuota = remainingOffs <= 0;
                    let mustOffFatigue = state.workStreak >= 5;

                    // ==========================================
                    // 1. ABSOLUTE HARD BLOCKS (Safety & Fatigue)
                    // ==========================================
                    if (mustOffFatigue) score += 5000000; // Max 5 days

                    // Rule: Max 6 straight days on Shift B, and max 6 straight days on Shift C.
                    // Once either streak hits 6, that same shift can't continue the next day.
                    // This is a soft (score) penalty; the true hard block with its edge-case
                    // fallback lives in the core-shift assignment loop below (atStreakCap).
                    if ((state.currentShiftId === shiftB_id || state.currentShiftId === shiftC_id)
                        && reqShiftId === state.currentShiftId
                        && state.shiftStreak >= 6) {
                        score += 5000000;
                    }
                    
                    // --- "INTO NIGHT" BLOCKS (Requires OFF before C) ---
                    // Rule: B -> C is not allowed without OFF
                    if (state.currentShiftId === shiftB_id && reqShiftId === shiftC_id) score += 5000000;
                    // Rule: G -> C is not allowed without OFF
                    if (state.currentShiftId === shiftG_id && reqShiftId === shiftC_id) score += 5000000;
                    // Rule: A -> C is not allowed without OFF
                    if (state.currentShiftId === shiftA_id && reqShiftId === shiftC_id) score += 5000000;

                    // --- "OUT OF NIGHT" BLOCKS (Requires OFF after C) ---
                    // Rule: C -> B is not allowed without OFF
                    if (state.currentShiftId === shiftC_id && reqShiftId === shiftB_id) score += 5000000;
                    // Rule: C -> A is not allowed without OFF
                    if (state.currentShiftId === shiftC_id && reqShiftId === shiftA_id) score += 5000000;
                    // General rule: C cannot go to A or G either. C MUST go to C or OFF.
                    if (state.currentShiftId === shiftC_id && reqShiftId !== shiftC_id) score += 5000000;

                    // --- OTHER TRANSITION BLOCKS ---
                    // Rule: B -> A is not allowed without OFF
                    if (state.currentShiftId === shiftB_id && reqShiftId === shiftA_id) score += 5000000;

                    // ==========================================

                    // 2. EXACT QUOTA ENFORCERS
                    if (mustOffQuota) score += 500000; 
                    if (mustWorkQuota) score -= 500000; 

                    // 3. THE "2-DAY OFF" RULE
                    if (state.currentShiftId === offShift.id && state.offStreak === 1) {
                        score += 50000; 
                    }

                    // 4. FATIGUE CURVE
                    score += Math.pow(state.workStreak, 3) * 50; 

                    // 5. SHIFT CONTINUATION (Prefer stability)
                    if (state.currentShiftId && state.currentShiftId !== offShift.id) {
                        if (state.currentShiftId === reqShiftId) {
                            score -= 2000; 
                            if (state.shiftStreak >= 3) score += 4000; 
                        } else {
                            score += 1500; 
                        }
                    }

                    // 6. BALANCE BURDEN
                    let ratio = remainingOffs / remainingDays; 
                    score += ratio * 5000;

                    // 7. EVEN-OUT SHIFT B & C ACROSS THE MONTH
                    // Whoever already has MORE of the requested B/C shift this month scores higher
                    // (=> less likely to be picked, since the lowest score wins), pulling everyone
                    // toward a near-equal count of B's and a near-equal count of C's by month end.
                    if (reqShiftId === shiftB_id) score += state.shiftBCount * 900;
                    if (reqShiftId === shiftC_id) score += state.shiftCCount * 900;

                    // ADD RANDOM TIE-BREAKER (Generates completely new puzzles every click)
                    return score + Math.random();
                };

                for (let day = 1; day <= daysInMonth; day++) {
                    const date = formatDate(day, currentMonth, currentYear);
                    if (!newSchedule[date]) newSchedule[date] = {};
                    
                    const isWeekEndDay = isWeekend(day, currentMonth, currentYear);
                    const manualAssignments = newSchedule[date]; 
                    
                    const assignedThisDayIds = Object.values(manualAssignments).map(v => typeof v === 'object' && v !== null ? v.id : v);
                    let missingCoreShifts = coreShifts.filter(s => !assignedThisDayIds.includes(s.id));
                    let availableEmps = employees.filter(e => !manualAssignments[e.id]);

                    let staffPool = [];

                    availableEmps.forEach(emp => {
                        let state = empStates[emp.id];
                        let isLeaveToday = leaves.some(l => l.date === date && l.empId === emp.id);
                        let isManager = (emp.role || '').trim().toLowerCase() === 'manager';
                        
                        let isHol = checkIsHoliday(date, emp, holidays, countries);
                        // Rule: Shift G is not allowed on Saturday, Sunday, or a Public Holiday.
                        let blockG = isWeekEndDay || isHol;

                        let remainingDays = daysInMonth - day + 1;
                        let remainingOffs = state.targetOffDays - state.currentOffCount;
                        
                        let mustOffQuota = remainingOffs >= remainingDays;
                        let mustOffFatigue = state.workStreak >= 5;
                        // Rule: B -> G and C -> G are not allowed without an OFF in between
                        let isIllegalToGManager = (state.currentShiftId === shiftB_id || state.currentShiftId === shiftC_id);
                        // Once this employee's monthly OFF quota (region cap, or natural weekend/
                        // holiday count) is used up, give them G instead of another OFF day —
                        // but NEVER on a Saturday or Sunday, since Shift G is not allowed then
                        // regardless of quota. It can still apply on a weekday public holiday.
                        let offQuotaExhaustedManager = remainingOffs <= 0 && !isWeekEndDay;

                        if (isLeaveToday) {
                            // Assign 'L' instead of standard Day Off
                            newSchedule[date][emp.id] = { id: 'L', isManual: false };
                        } else if (isManager) {
                            if (mustOffFatigue || isIllegalToGManager) {
                                newSchedule[date][emp.id] = { id: offShift.id, isManual: false };
                            } else if (offQuotaExhaustedManager) {
                                newSchedule[date][emp.id] = { id: shiftG_id, isManual: false };
                            } else if (blockG || mustOffQuota) {
                                newSchedule[date][emp.id] = { id: offShift.id, isManual: false };
                            } else {
                                newSchedule[date][emp.id] = { id: shiftG_id, isManual: false };
                            }
                        } else {
                            staffPool.push({ emp, state, blockG });
                        }
                    });

                    // 1. ASSIGN CORE SHIFTS (NIGHT SHIFT ALWAYS GETS FIRST PICK TO PREVENT STARVATION)
                    // Rule: On Saturdays, Sundays, and Public Holidays, only ONE person is scheduled
                    // for Shift A, ONE for Shift B, and ONE for Shift C. missingCoreShifts always
                    // holds at most one entry per shift code, and each entry is filled by exactly one
                    // staff member below, so this cap is guaranteed on every day of the month,
                    // including weekends/holidays.
                    missingCoreShifts.sort((a, b) => {
                        const priority = { [shiftC_id]: 1, [shiftA_id]: 2, [shiftB_id]: 3 };
                        return (priority[a.id] || 99) - (priority[b.id] || 99);
                    }).forEach(reqShift => {
                        // Rule: max 6 straight days on Shift B or Shift C. This is a hard exclusion
                        // (not just a score penalty) — someone at the cap must NEVER be picked again
                        // for that same shift, even if every other candidate also scores badly.
                        const atStreakCap = (candidate) =>
                            (reqShift.id === shiftB_id || reqShift.id === shiftC_id) &&
                            candidate.state.currentShiftId === reqShift.id &&
                            candidate.state.shiftStreak >= 6;

                        let eligible = staffPool.filter(p => !atStreakCap(p));
                        // Edge case only: if literally everyone available is already at the 6-day
                        // cap (e.g. a very small team), fall back to the full pool so the shift
                        // still gets covered rather than left empty. This fallback is the ONLY
                        // sanctioned way a streak may run past 6 — it never applies otherwise.
                        let pool = eligible.length > 0 ? eligible : staffPool;

                        pool.sort((a, b) => calculateScore(a, reqShift.id, day) - calculateScore(b, reqShift.id, day));
                        let chosen = pool.shift();
                        if (chosen) {
                            staffPool = staffPool.filter(p => p !== chosen);
                            newSchedule[date][chosen.emp.id] = { id: reqShift.id, isManual: false };
                        }
                    });

                    // 2. ASSIGN REMAINDER TO G OR OFF SAFELY
                    staffPool.forEach(p => {
                        let remainingDays = daysInMonth - day + 1;
                        let remainingOffs = p.state.targetOffDays - p.state.currentOffCount;
                        
                        // Rule: C -> G and B -> G are not allowed without an OFF in between
                        let isIllegalToG = (p.state.currentShiftId === shiftC_id || p.state.currentShiftId === shiftB_id);
                        let mustOffFatigue = p.state.workStreak >= 5;
                        // Once this employee's monthly OFF quota (region cap, or natural weekend/
                        // holiday count) is used up, give them G instead of another OFF day —
                        // but NEVER on a Saturday or Sunday, since Shift G is not allowed then
                        // regardless of quota. It can still apply on a weekday public holiday.
                        let offQuotaExhausted = remainingOffs <= 0 && !isWeekEndDay;

                        if (mustOffFatigue || isIllegalToG) {
                            // Hard safety rules always win, regardless of OFF quota.
                            newSchedule[date][p.emp.id] = { id: offShift.id, isManual: false };
                        } else if (offQuotaExhausted) {
                            newSchedule[date][p.emp.id] = { id: shiftG_id, isManual: false };
                        } else if (p.blockG || remainingOffs >= remainingDays) {
                            newSchedule[date][p.emp.id] = { id: offShift.id, isManual: false };
                        } else {
                            // Reserve enough of the remaining OFF budget to cover every Saturday,
                            // Sunday, and holiday still ahead this month — those are forced OFF days
                            // (see the p.blockG branch above) no matter what. Only spend an OFF today,
                            // a purely discretionary weekday, if there's budget left over ABOVE that
                            // reserve; otherwise take G instead so the reserve stays intact and the
                            // month's total OFF count can't run past the natural target.
                            let futureForcedOffDays = countFutureForcedOffDays(p.emp.id, day);
                            let discretionarySlack = remainingOffs - futureForcedOffDays;

                            if (discretionarySlack > 0 && p.state.currentShiftId === offShift.id && p.state.offStreak === 1) {
                                newSchedule[date][p.emp.id] = { id: offShift.id, isManual: false };
                            } else if (discretionarySlack <= 0) {
                                newSchedule[date][p.emp.id] = { id: shiftG_id, isManual: false };
                            } else {
                                let ratio = remainingOffs / remainingDays;
                                let randomThreshold = 0.35 + (Math.random() * 0.2);

                                if (ratio > randomThreshold) {
                                    newSchedule[date][p.emp.id] = { id: offShift.id, isManual: false };
                                } else {
                                    newSchedule[date][p.emp.id] = { id: shiftG_id, isManual: false };
                                }
                            }
                        }
                    });

                    // 3. ADVANCE STATES AND COUNTERS PRECISELY
                    employees.forEach(emp => {
                        let val = newSchedule[date][emp.id];
                        let assignedShiftId = typeof val === 'object' && val !== null ? val.id : val;
                        let state = empStates[emp.id];
                        
                        if (assignedShiftId === 'L') {
                            // Reset fatigue streaks, but DO NOT increment currentOffCount
                            state.workStreak = 0;
                            state.shiftStreak = 0;
                            state.currentShiftId = 'L';
                        } else if (assignedShiftId === offShift.id) {
                            state.currentOffCount++; 
                            state.workStreak = 0;
                            state.shiftStreak = 0;
                            state.offStreak++;
                            state.currentShiftId = offShift.id; 
                        } else if (assignedShiftId) {

                            state.workStreak++;
                            state.offStreak = 0;
                            if (assignedShiftId === shiftB_id) state.shiftBCount++;
                            if (assignedShiftId === shiftC_id) state.shiftCCount++;
                            if (state.currentShiftId === assignedShiftId) {
                                state.shiftStreak++; 
                            } else {
                                state.shiftStreak = 1; 
                            }
                            state.currentShiftId = assignedShiftId;
                        }
                    });
                }
                
                setSchedule(newSchedule);
            };

            const clearSchedule = () => {
                setSchedule(prev => {
                    const next = {};
                    Object.keys(prev).forEach(date => {
                        Object.keys(prev[date] || {}).forEach(empIdStr => {
                            const val = prev[date][empIdStr];
                            if (typeof val === 'object' && val !== null && val.isRequest) {
                                if (!next[date]) next[date] = {};
                                next[date][empIdStr] = val;
                            }
                        });
                    });
                    return next;
                });
                showToast('Roster cleared. Staff shift requests were kept in place.');
            };

            // --- EXPLICIT SAVE FUNCTIONS (writes immediately to localStorage + confirms to user) ---
            const persistNow = (overrides) => {
                try {
                    const existing = JSON.parse(localStorage.getItem('shiftManagerAppOfflineData') || '{}');
                    const merged = {
                        employees, shiftTypes, schedule, darkMode, countries, holidays, leaves, shiftRequests, leaveConfig, offRules,
                        ...existing,
                        ...overrides
                    };
                    localStorage.setItem('shiftManagerAppOfflineData', JSON.stringify(merged));
                    return true;
                } catch (e) { return false; }
            };

            // Builds a fresh Excel workbook of ALL current settings (Employees, Shift Codes,
            // OFF Day Rules, Holidays, Leaves, Regions) and triggers a browser download.
            // Called automatically every time any Settings "Save" button is used, so every
            // saved settings change also has an up-to-date Excel backup on disk.
            const exportSettingsToExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();

                    // Sheet: Employees
                    const empHeader = ['ID', 'Code', 'Name', 'Group', 'Role', 'Country', 'Email', 'Phone'];
                    const empRows = [empHeader, ...employees.map(e => [
                        e.id, e.code || '', e.name || '', e.group || '', e.role || '', e.country || '', e.email || '', e.phone || ''
                    ])];
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(empRows), 'Employees');

                    // Sheet: Shift Codes (incl. per-country region codes, and the synthetic Leave type)
                    const scHeader = ['Shift Name', 'Short Name', 'Start', 'End', 'Color', ...countries.map(c => `Region Code (${c.code})`)];
                    const scRows = [scHeader];
                    shiftTypes.forEach(s => {
                        scRows.push([s.name, s.shortName, s.start || '', s.end || '', s.color || '', ...countries.map(c => (s.regionCodes && s.regionCodes[c.code]) || '')]);
                    });
                    scRows.push(['Leave', 'L', '', '', leaveConfig.color || '', ...countries.map(c => (leaveConfig.regionCodes && leaveConfig.regionCodes[c.code]) || '')]);
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(scRows), 'Shift Codes');

                    // Sheet: OFF Day Rules
                    const offHeader = ['Country Code', 'Country Name', 'Max OFF Days / Month'];
                    const offRows = [offHeader, ...countries.map(c => [
                        c.code, c.name,
                        (offRules[c.code] !== undefined && offRules[c.code] !== '') ? offRules[c.code] : '(auto: natural weekends + holidays)'
                    ])];
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(offRows), 'OFF Day Rules');

                    // Sheet: Holidays
                    const holHeader = ['Date', 'Holiday Name', 'Country Code'];
                    const holRows = [holHeader, ...holidays.map(h => [h.date, h.name, h.countryCode || h.country || ''])];
                    if (holRows.length === 1) holRows.push(['(no holidays configured)', '', '']);
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(holRows), 'Holidays');

                    // Sheet: Leaves
                    const lvHeader = ['Date', 'Employee', 'Reason'];
                    const lvRows = [lvHeader, ...leaves.map(l => {
                        const emp = employees.find(e => e.id === l.empId);
                        return [l.date, emp ? emp.name : 'Unknown', l.reason || ''];
                    })];
                    if (lvRows.length === 1) lvRows.push(['(no leaves configured)', '', '']);
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lvRows), 'Leaves');

                    // Sheet: Regions
                    const cHeader = ['Country Code', 'Country Name'];
                    const cRows = [cHeader, ...countries.map(c => [c.code, c.name])];
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cRows), 'Regions');

                    const timestamp = new Date().toISOString().slice(0, 10);
                    XLSX.writeFile(wb, `Shift_Roster_Settings_${timestamp}.xlsx`);
                    return true;
                } catch (e) {
                    return false;
                }
            };

            const saveEmployeeConfig = () => {
                const ok = persistNow({ employees, countries });
                const exported = ok && exportSettingsToExcel();
                showToast(ok ? (exported ? 'Employee configuration saved and backed up to Excel.' : 'Employee configuration saved, but the Excel backup failed.') : 'Failed to save employee configuration.', ok ? 'success' : 'error');
            };

            const saveShiftCodes = () => {
                const ok = persistNow({ shiftTypes, leaveConfig });
                const exported = ok && exportSettingsToExcel();
                showToast(ok ? (exported ? 'Shift codes saved and backed up to Excel.' : 'Shift codes saved, but the Excel backup failed.') : 'Failed to save shift codes.', ok ? 'success' : 'error');
            };

            const saveHolidayConfig = () => {
                const ok = persistNow({ holidays, leaves });
                const exported = ok && exportSettingsToExcel();
                showToast(ok ? (exported ? 'Holidays & leaves saved and backed up to Excel.' : 'Holidays & leaves saved, but the Excel backup failed.') : 'Failed to save holidays & leaves.', ok ? 'success' : 'error');
            };

            const saveOffRules = () => {
                const ok = persistNow({ offRules });
                const exported = ok && exportSettingsToExcel();
                showToast(ok ? (exported ? 'OFF day rules saved and backed up to Excel.' : 'OFF day rules saved, but the Excel backup failed.') : 'Failed to save OFF day rules.', ok ? 'success' : 'error');
            };

            // --- EXCEL EXPORT HELPERS ---
            const getDateRangeArray = (fromStr, toStr) => {
                const dates = [];
                let cur = new Date(fromStr + 'T00:00:00');
                const end = new Date(toStr + 'T00:00:00');
                while (cur <= end) {
                    const y = cur.getFullYear(), m = String(cur.getMonth() + 1).padStart(2, '0'), d = String(cur.getDate()).padStart(2, '0');
                    dates.push(`${y}-${m}-${d}`);
                    cur.setDate(cur.getDate() + 1);
                }
                return dates;
            };

            const dayLabel = (dateStr) => {
                const dt = new Date(dateStr + 'T00:00:00');
                const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()];
                const mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][dt.getMonth()];
                return `${String(dt.getDate()).padStart(2, '0')}-${mo} (${wd})`;
            };

            const buildAndDownloadExcel = (dates, filename, reportLabel) => {
                if (typeof XLSX === 'undefined') {
                    showToast('Excel library failed to load. Check your internet connection.', 'error');
                    return;
                }
                if (!dates.length) {
                    showToast('No dates found for this report.', 'error');
                    return;
                }

                // --- Sheet 1: Schedule ---
                const scheduleHeader = ['Employee', 'Code', 'Group', 'Role', 'Country', ...dates.map(dayLabel), ...shiftTypes.map(s => `Total ${s.shortName}`), 'Total Leave'];
                const scheduleRows = [scheduleHeader];

                employees.forEach(emp => {
                    const row = [emp.name, emp.code || '', emp.group || '', emp.role, emp.country];
                    const counts = {}; shiftTypes.forEach(s => counts[s.id] = 0);
                    let leaveCount = 0;
                    dates.forEach(date => {
                        const shiftId = getShiftIdForDate(date, emp.id);
                        if (shiftId === 'L') { row.push('L'); leaveCount++; }
                        else {
                            const shift = getShiftForEmployee(shiftId, emp);
                            row.push(shift ? shift.shortName : '-');
                            if (shift) counts[shiftId]++;
                        }
                    });
                    shiftTypes.forEach(s => row.push(counts[s.id]));
                    row.push(leaveCount);
                    scheduleRows.push(row);
                });

                const wsSchedule = XLSX.utils.aoa_to_sheet(scheduleRows);
                wsSchedule['!cols'] = [{ wch: 18 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, ...dates.map(() => ({ wch: 13 })), ...shiftTypes.map(() => ({ wch: 10 })), { wch: 10 }];

                // --- Sheet 2: Summary ---
                const summaryHeader = ['Employee', 'Code', 'Group', 'Role', 'Country', ...shiftTypes.map(s => s.name), 'Leave', 'Total Days', 'Off Target', 'Off Actual'];
                const summaryRows = [summaryHeader];
                employees.forEach(emp => {
                    const counts = {}; shiftTypes.forEach(s => counts[s.id] = 0);
                    let leaveCount = 0, offTarget = 0, offActual = 0, total = 0;
                    dates.forEach(date => {
                        const shiftId = getShiftIdForDate(date, emp.id);
                        const dt = new Date(date + 'T00:00:00');
                        const isWknd = dt.getDay() === 0 || dt.getDay() === 6;
                        const isHol = checkIsHoliday(date, emp, holidays, countries);
                        if (isWknd || isHol) offTarget++;
                        if (shiftId === 'L') { leaveCount++; total++; }
                        else if (shiftId) {
                            total++;
                            const shift = shiftTypes.find(s => s.id === shiftId);
                            if (shift) {
                                counts[shift.id]++;
                                if (shift.shortName === 'OFF' || shift.name === 'Day Off') offActual++;
                            }
                        }
                    });
                    summaryRows.push([emp.name, emp.code || '', emp.group || '', emp.role, emp.country, ...shiftTypes.map(s => counts[s.id]), leaveCount, total, offTarget, offActual]);
                });
                const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);

                // --- Sheet 3: Holidays & Leaves within range ---
                const hlHeader = ['Type', 'Date', 'Name / Employee', 'Country / Reason'];
                const hlRows = [hlHeader];
                holidays.filter(h => dates.includes(h.date)).forEach(h => hlRows.push(['Holiday', h.date, h.name, h.countryCode || h.country || '']));
                leaves.filter(l => dates.includes(l.date)).forEach(l => {
                    const emp = employees.find(e => e.id === l.empId);
                    hlRows.push(['Leave', l.date, emp ? emp.name : 'Unknown', l.reason || '']);
                });
                if (hlRows.length === 1) hlRows.push(['No holidays or leaves in this period.', '', '', '']);
                const wsHL = XLSX.utils.aoa_to_sheet(hlRows);

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, wsSchedule, 'Schedule');
                XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
                XLSX.utils.book_append_sheet(wb, wsHL, 'Holidays & Leaves');

                XLSX.writeFile(wb, `${filename}.xlsx`);
                showToast(`${reportLabel} exported successfully.`);
            };

            const exportMonthlyReport = () => {
                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const dates = Array.from({ length: daysInMonth }, (_, i) => formatDate(i + 1, currentMonth, currentYear));
                buildAndDownloadExcel(dates, `Monthly_Report_${monthNames[currentMonth]}_${currentYear}`, 'Monthly report');
            };

            const exportAdhocReport = () => {
                if (!adhocFrom || !adhocTo) { showToast('Please select both cut-off dates.', 'error'); return; }
                if (adhocFrom > adhocTo) { showToast('The start date must be before the end date.', 'error'); return; }
                const dates = getDateRangeArray(adhocFrom, adhocTo);
                buildAndDownloadExcel(dates, `Adhoc_Report_${adhocFrom}_to_${adhocTo}`, 'Ad-hoc report');
            };

            // --- ROSTER EXCEL TEMPLATE (download) & UPLOAD (apply) FOR THE CURRENT MONTH ---
            // Downloads a fill-in-the-blanks .xlsx for the month currently open in the Schedule
            // view, pre-filled with whatever is already scheduled, so it doubles as a starting
            // point for edits done outside the app (e.g. by someone without access to it).
            const downloadRosterTemplate = () => {
                if (typeof XLSX === 'undefined') {
                    showToast('Excel library failed to load. Check your internet connection.', 'error');
                    return;
                }
                const daysInMonth = getDaysInMonth(currentMonth, currentYear);
                const dates = Array.from({ length: daysInMonth }, (_, i) => formatDate(i + 1, currentMonth, currentYear));
                const weekdayAbbr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

                // Each date column header leads with the ISO date (YYYY-MM-DD) so the upload can
                // match columns back to real dates regardless of locale or display formatting.
                const header = ['Employee Name', 'Employee Code', 'Group', 'Country', ...dates.map(d => {
                    const wd = weekdayAbbr[new Date(d + 'T00:00:00').getDay()];
                    return `${d} (${wd})`;
                })];

                const rows = [header];
                employees.forEach(emp => {
                    const row = [emp.name, emp.code || '', emp.group || '', emp.country || ''];
                    dates.forEach(date => {
                        const shiftId = getShiftIdForDate(date, emp.id);
                        const shiftDef = getShiftForEmployee(shiftId, emp);
                        let cell = shiftDef ? shiftDef.shortName : '';
                        // The [LOCKED] tag is informational only — a Shift Request's lock is
                        // read from the app's own data on upload, not from this cell's text.
                        if (isShiftRequested(date, emp.id)) cell = cell ? `${cell} [LOCKED]` : '[LOCKED]';
                        row.push(cell);
                    });
                    rows.push(row);
                });

                const wsRoster = XLSX.utils.aoa_to_sheet(rows);
                wsRoster['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, ...dates.map(() => ({ wch: 16 }))];

                const instrRows = [
                    ['Roster Upload Template — Instructions'],
                    [''],
                    [`Month: ${monthNames[currentMonth]} ${currentYear}`],
                    [''],
                    ['How to fill this in:'],
                    ['1. Do not change the header row or the Employee Code column — they are used to match rows back to employees in the app.'],
                    ['2. Fill in one shift code per day, in the column for that date, using the codes listed below.'],
                    ['3. Leave a cell blank to keep that day unchanged from what is already scheduled in the app.'],
                    ['4. Type a dash "-" in a cell to clear whatever shift is currently scheduled for that day.'],
                    ['5. Cells marked [LOCKED] belong to an approved Shift Request and cannot be changed here — edits to them are ignored on upload.'],
                    ['6. Codes are not case-sensitive.'],
                    [''],
                    ['Valid shift codes:'],
                    ...shiftTypes.map(s => [s.shortName, s.name]),
                    ['L', 'Leave'],
                    ['-', 'Clear / remove the current assignment'],
                    [''],
                    ['Rules enforced automatically on upload:'],
